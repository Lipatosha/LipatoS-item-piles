name: Build Item Piles repository

on:
  push:
    paths:
      - '.build-ready'

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore module archive and unpack
        shell: bash
        run: |
          cat .build-parts/part-* > /tmp/item-piles.b64
          base64 --decode /tmp/item-piles.b64 > lipatos-item-piles-v3.3.4-rub-fix46.zip
          unzip -o lipatos-item-piles-v3.3.4-rub-fix46.zip
          git add LICENSE module.json dist languages icons templates lipatos-item-piles-v3.3.4-rub-fix46.zip
          git rm -r .build-parts .build-ready .github/workflows/unpack-module.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Добавить рабочую сборку Item Piles"
          git push
