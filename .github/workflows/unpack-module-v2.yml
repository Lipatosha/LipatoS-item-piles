name: Build Item Piles repository v2

on:
  push:
    paths:
      - '.build-ready2'

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore LipatoS changes
        shell: bash
        run: |
          set -euo pipefail
          cat .build-parts/part-000 .build-parts/part-001 .build-parts/part-002 \
              .build-parts/part-003 .build-parts/part-004 .build-parts/part-005 \
              .build-parts/part-006 .build-parts/part-007 .build-parts/part-008 \
              .build-parts2/part-* > /tmp/custom-payload.b64
          base64 --decode /tmp/custom-payload.b64 > /tmp/custom-payload.tar.xz
          xz -t /tmp/custom-payload.tar.xz

      - name: Download original Item Piles 3.3.4
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            https://github.com/fantasycalendar/FoundryVTT-ItemPiles/releases/download/3.3.4/module.zip \
            -o /tmp/upstream.zip
          rm -rf /tmp/item-piles-build
          mkdir -p /tmp/item-piles-build
          unzip -q -o /tmp/upstream.zip -d /tmp/item-piles-build

      - name: Apply LipatoS build
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf /tmp/custom-payload.tar.xz -C /tmp/item-piles-build
          cp module.json /tmp/item-piles-build/module.json
          rm -f /tmp/item-piles-build/dist/item-piles.js.map

          mkdir -p /tmp/item-piles-build/icons/trade-currency
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/Lipatosha/LipatoS-gatherer/main/icons/currency/copper.png \
            -o /tmp/item-piles-build/icons/trade-currency/copper.png
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/Lipatosha/LipatoS-gatherer/main/icons/currency/silver.png \
            -o /tmp/item-piles-build/icons/trade-currency/silver.png
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/Lipatosha/LipatoS-gatherer/main/icons/currency/gold.png \
            -o /tmp/item-piles-build/icons/trade-currency/gold.png

          cat > /tmp/item-piles-build/icons/trade-currency/README.txt <<'EOF'
          Иконки валюты LipatoS: медная, серебряная и золотая монеты.
          Изображения оптимизированы без изменения разрешения 1254x1254.
          EOF

          rm -rf dist languages icons templates
          cp -R /tmp/item-piles-build/dist .
          cp -R /tmp/item-piles-build/languages .
          cp -R /tmp/item-piles-build/icons .
          cp -R /tmp/item-piles-build/templates .

          rm -f lipatos-item-piles-v3.3.4-rub-fix46.zip
          (
            cd /tmp/item-piles-build
            zip -q -r "$GITHUB_WORKSPACE/lipatos-item-piles-v3.3.4-rub-fix46.zip" \
              LICENSE module.json dist languages icons templates
          )

      - name: Commit finished module
        shell: bash
        run: |
          set -euo pipefail
          git add LICENSE module.json dist languages icons templates \
            lipatos-item-piles-v3.3.4-rub-fix46.zip
          git rm -r .build-parts .build-parts2 .build-ready .build-ready2 \
            .github/workflows/unpack-module.yml .github/workflows/unpack-module-v2.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Добавить рабочую сборку Item Piles"
          git push
